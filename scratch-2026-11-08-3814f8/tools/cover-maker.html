<!doctype html>
<html><head><meta charset="utf-8"><title>4A Cover Maker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Antonio:wght@300;400;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,700;6..12,800&family=Prata&display=swap">
<style>body{margin:0;background:#111;color:#fff;font:14px sans-serif;padding:16px}#out{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}#out img{width:100%;display:block;border-radius:8px}#log{margin:8px 0}</style>
</head><body>
<div id="log">Rendering…</div><div id="out"></div>
<script src="../assets/units-data.js"></script>
<script>
/* Renders one branded 1200×900 cover per unit from its best photo (assets/units/<code>-1.jpg). */
const W = 1200, H = 900;
const LOGO_PATH = 'M362 100L396 155L255 400H432L460 447H160ZM425 205L627 543H565L428 315L357 387H317ZM271 462H348L309 543H232ZM365 494H505L528 543H341Z';
const DEAL = { sale: 'FOR SALE', rent: 'FOR RENT', furnished: 'FURNISHED RENT' };
const fmt = n => Math.round(n).toLocaleString('en-US');
const load = src => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = src; });

function price(u){
  if (u.line) return u.line;
  if (u.price == null) return 'PRICE ON REQUEST';
  if (u.deal !== 'sale') return `EGP ${fmt(u.price)} / MONTH`;
  return `EGP ${fmt(u.price)}`;
}
function specs(u){
  if (u.sub != null) return u.sub;
  const a = [];
  if (u.size) a.push(`${fmt(u.size)} M²`);
  if (u.beds) a.push(`${u.beds} BED`);
  if (u.baths) a.push(`${u.baths} BATH`);
  if (u.garden) a.push(`${u.garden} M² GARDEN`);
  return a.slice(0, 3).join('   ·   ');
}
function cover(ctx, img, x, y, w, h, zoom = 1.04){
  const s = Math.max(w / img.width, h / img.height) * zoom;
  const iw = img.width * s, ih = img.height * s;
  ctx.drawImage(img, x + (w - iw) / 2, y + (h - ih) / 2, iw, ih);
}
function logo(ctx, x, y, size, fill){
  ctx.save(); ctx.translate(x, y); const k = size / 465; ctx.scale(k, k); ctx.translate(-150, -90);
  ctx.fillStyle = fill; ctx.fill(new Path2D(LOGO_PATH)); ctx.restore();
}
function cubes(ctx, alpha){
  ctx.save(); ctx.strokeStyle = `rgba(255,255,255,${alpha})`; ctx.lineWidth = 1;
  for (let ty = -104; ty < H + 104; ty += 104) for (let tx = -60; tx < W + 60; tx += 60) {
    [[0,0],[30,52]].forEach(([ox, oy]) => {
      const cx = tx + ox, cy = ty + oy;
      ctx.beginPath();
      ctx.moveTo(cx+30,cy); ctx.lineTo(cx+60,cy+17.3); ctx.lineTo(cx+60,cy+52); ctx.lineTo(cx+30,cy+69.3); ctx.lineTo(cx,cy+52); ctx.lineTo(cx,cy+17.3); ctx.closePath();
      ctx.moveTo(cx+30,cy+34.6); ctx.lineTo(cx+60,cy+17.3); ctx.moveTo(cx+30,cy+34.6); ctx.lineTo(cx,cy+17.3); ctx.moveTo(cx+30,cy+34.6); ctx.lineTo(cx+30,cy+69.3);
      ctx.stroke();
    });
  }
  ctx.restore();
}
function fitText(ctx, text, font, max, size){
  let s = size; do { ctx.font = font.replace('{s}', s); s -= 2; } while (ctx.measureText(text).width > max && s > 20); return s + 2;
}

async function render(u){
  const img = await load(u.src || `../assets/units/${u.code}-1.jpg`);
  const c = document.createElement('canvas'); c.width = W; c.height = H; const ctx = c.getContext('2d');
  const portrait = img.width / img.height < 1.15;

  // 1. photo — graded so weak shots read richer; portrait sources sit in a framed panel over a blurred fill
  ctx.filter = 'saturate(1.15) contrast(1.08) brightness(1.04)';
  if (portrait){
    ctx.save(); ctx.filter = 'blur(28px) saturate(1.1) brightness(.75)'; cover(ctx, img, -60, -60, W + 120, H + 120, 1.1); ctx.restore();
    ctx.filter = 'saturate(1.15) contrast(1.08) brightness(1.04)';
    const pw = 470, ph = 760, px = W - pw - 70, py = 70;
    ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 50; ctx.shadowOffsetY = 20;
    ctx.beginPath(); ctx.roundRect(px, py, pw, ph, 22); ctx.fillStyle = '#000'; ctx.fill(); ctx.restore();
    ctx.save(); ctx.beginPath(); ctx.roundRect(px, py, pw, ph, 22); ctx.clip(); cover(ctx, img, px, py, pw, ph, 1.02); ctx.restore();
  } else {
    cover(ctx, img, 0, 0, W, H);
  }
  ctx.filter = 'none';

  // 2. light: soft blue tint from top, deep navy from bottom-left for the text
  let g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, 'rgba(10,29,53,.38)'); g.addColorStop(.28, 'rgba(10,29,53,0)'); g.addColorStop(.52, 'rgba(10,29,53,.05)'); g.addColorStop(1, 'rgba(7,17,30,.92)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  g = ctx.createLinearGradient(0, 0, W, 0); g.addColorStop(0, 'rgba(7,17,30,.55)'); g.addColorStop(.55, 'rgba(7,17,30,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // 3. brand shape: the slanted bar of the 4A mark, rising from the bottom-left
  ctx.save();
  ctx.beginPath(); ctx.moveTo(0, H); ctx.lineTo(0, 560); ctx.lineTo(70, 520); ctx.lineTo(portrait ? 640 : 760, 520); ctx.lineTo(portrait ? 640 : 760, H); ctx.closePath();
  g = ctx.createLinearGradient(0, 520, 0, H); g.addColorStop(0, 'rgba(10,29,53,.0)'); g.addColorStop(1, 'rgba(10,29,53,.35)');
  ctx.fillStyle = g; ctx.fill(); ctx.clip(); cubes(ctx, .05); ctx.restore();
  const ag = ctx.createLinearGradient(0, 0, 300, 0); ag.addColorStop(0, '#4aa8f5'); ag.addColorStop(1, '#1b5592');
  ctx.save(); ctx.beginPath(); ctx.moveTo(64, 556); ctx.lineTo(84, 544); ctx.lineTo(220, 544); ctx.lineTo(200, 556); ctx.closePath(); ctx.fillStyle = ag; ctx.fill(); ctx.restore();

  // 4. frame + brand mark
  ctx.strokeStyle = 'rgba(255,255,255,.28)'; ctx.lineWidth = 1.5; ctx.strokeRect(28, 28, W - 56, H - 56);
  const lg = ctx.createLinearGradient(0, 40, 0, 120); lg.addColorStop(0, '#7cc0ff'); lg.addColorStop(1, '#ffffff');
  logo(ctx, 64, 60, 78, lg);
  ctx.fillStyle = '#fff'; ctx.font = '600 30px Antonio'; ctx.textBaseline = 'alphabetic';
  ctx.fillText('4A', 152, 92); ctx.font = '700 13px "Nunito Sans"'; ctx.letterSpacing = '5px'; ctx.fillText('REAL ESTATE', 153, 116); ctx.letterSpacing = '0px';

  // code tag
  ctx.font = '600 24px Antonio'; ctx.letterSpacing = '3px';
  const code = u.tag || ('4A' + u.code), cw = ctx.measureText(code).width + 36;
  ctx.fillStyle = 'rgba(7,17,30,.55)'; ctx.beginPath(); ctx.roundRect(W - 64 - cw, 60, cw, 46, 10); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.fillText(code, W - 64 - cw + 18, 92); ctx.letterSpacing = '0px';

  // 5. text block
  const tx = 64, maxW = portrait ? 560 : 900;
  ctx.font = '800 16px "Nunito Sans"'; ctx.letterSpacing = '4px';
  const deal = u.label || DEAL[u.deal], dw = ctx.measureText(deal).width + 40;
  ctx.fillStyle = (u.deal === 'sale' || u.label) ? ag : (() => { const gg = ctx.createLinearGradient(tx, 0, tx + dw, 0); gg.addColorStop(0, '#2fa07e'); gg.addColorStop(1, '#155a48'); return gg; })();
  ctx.beginPath(); ctx.roundRect(tx, 582, dw, 38, 19); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.fillText(deal, tx + 20, 607); ctx.letterSpacing = '0px';

  const hook = u.hook.toUpperCase();
  const hs = fitText(ctx, hook, '700 {s}px Antonio', maxW, 96);
  ctx.font = `700 ${hs}px Antonio`; ctx.fillStyle = '#fff'; ctx.letterSpacing = '1px'; ctx.fillText(hook, tx - 3, 700); ctx.letterSpacing = '0px';
  ctx.font = '28px Prata'; ctx.fillStyle = 'rgba(255,255,255,.88)'; ctx.fillText(u.loc, tx, 748);

  ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.beginPath(); ctx.moveTo(tx, 780); ctx.lineTo(tx + maxW, 780); ctx.stroke();
  ctx.font = '600 40px Antonio'; ctx.letterSpacing = '1px';
  const pg = ctx.createLinearGradient(tx, 0, tx + 400, 0); pg.addColorStop(0, '#9fd2ff'); pg.addColorStop(1, '#ffffff');
  ctx.fillStyle = pg; ctx.fillText(price(u), tx, 836);
  const pw2 = ctx.measureText(price(u)).width; ctx.letterSpacing = '0px';
  ctx.font = '700 16px "Nunito Sans"'; ctx.letterSpacing = '3px'; ctx.fillStyle = 'rgba(255,255,255,.75)';
  const sp = specs(u); if (sp) ctx.fillText(sp, Math.max(tx + pw2 + 40, tx), 830); ctx.letterSpacing = '0px';

  return c.toDataURL('image/jpeg', .86);
}

(async () => {
  await Promise.all(['700 96px Antonio', '600 40px Antonio', '28px Prata', '800 16px "Nunito Sans"', '700 16px "Nunito Sans"'].map(f => document.fonts.load(f)));
  const out = document.getElementById('out'), log = document.getElementById('log');
  const only = new URLSearchParams(location.search).get('only');
  let done = 0;
  for (const u of window.UNITS){
    if (only && u.code !== only) continue;
    const url = await render(u);
    const im = new Image(); im.src = url; im.title = u.code; out.appendChild(im);
    if (location.port === '8766') await fetch(`/save?name=${u.code}.jpg`, { method: 'POST', body: url });
    log.textContent = `Rendered ${++done}`;
  }
  // project covers: one per project that has units
  const PROJ = [
    { id: 'mazarine', name: 'Mazarine', dev: 'City Edge Developments', loc: 'New Alamein, North Coast', src: '2020' },
    { id: 'sawary', name: 'Sawary', dev: 'Saudi Egyptian Developers', loc: 'New Alexandria', src: '1059' },
    { id: 'muruj', name: 'Muruj', dev: '', loc: 'Smouha, Alexandria', src: '2015' },
    { id: 'jewar', name: 'Jewar', dev: '', loc: 'King Mariout, Alexandria', src: '1074' }
  ];
  for (const p of PROJ){
    if (only && only !== p.id) continue;
    const n = window.UNITS.filter(u => u.proj === p.id).length;
    const url = await render({ code: p.id, src: `../assets/units/${p.src}-1.jpg`, tag: 'PROJECT', label: 'NOW AVAILABLE', hook: p.name, loc: p.loc,
      line: `${n} ${n === 1 ? 'UNIT' : 'UNITS'} WITH 4A`, sub: p.dev ? p.dev.toUpperCase() : '' });
    const im = new Image(); im.src = url; out.appendChild(im);
    if (location.port === '8766') await fetch(`/save?name=project-${p.id}.jpg`, { method: 'POST', body: url });
    done++;
  }
  log.textContent = `Done: ${done} covers`; window.__done = done;
})();
</script>
</body></html>
